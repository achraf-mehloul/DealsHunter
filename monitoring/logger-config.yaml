version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  simple:
    format: '%(levelname)s - %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: /app/logs/app.log
    maxBytes: 10485760
    backupCount: 5

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: /app/logs/error.log
    maxBytes: 10485760
    backupCount: 5

loggers:
  amazon_core:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: no

  telegram_bot:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: no

  api_gateway:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: no

root:
  level: INFO
  handlers: [console]
